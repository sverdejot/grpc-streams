syntax = "proto3";

package bid.v1;

import "bid/v1/request.proto";
import "bid/v1/response.proto";

option go_package = "github.com/sverdejot/grpc-streams/internal/api/grpc/v1;bidpb";

service AuctionService {
    rpc CreateBid(CreateBidRequest) returns (CreateBidResponse) {};
    rpc GetBids(GetBidsRequest) returns (stream GetBidsResponse) {};
}
